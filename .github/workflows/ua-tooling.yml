name: Understand Anything contract
on:
  pull_request:
    paths:
      - 'tools/understand-anything/**'
      - '.github/workflows/ua-tooling.yml'
  push:
    branches: [dev, pre-dev]
    paths:
      - 'tools/understand-anything/**'
      - '.github/workflows/ua-tooling.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    container: node@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned producer and consumer in a clean profile
        run: |
          python3 tools/understand-anything/install.py --runtime-root /tmp/oriso-ua-runtime --profile /tmp/oriso-ua-profile
      - name: Test graph extraction, semantics, platform and consumer
        run: |
          export UA_CORE=/tmp/oriso-ua-runtime/current/upstream/understand-anything-plugin/packages/core/dist/index.js
          cd /tmp/oriso-ua-runtime/current/tooling
          npm test
      - name: Test patched viewer evidence, relation categories and container connections
        run: |
          cd /tmp/oriso-ua-runtime/current/upstream
          npm exec --yes --package=pnpm@10.6.2 -- pnpm --filter @understand-anything/core exec vitest run src/__tests__/search.test.ts src/__tests__/embedding-search.test.ts
          npm exec --yes --package=pnpm@10.6.2 -- pnpm --filter @understand-anything/dashboard exec vitest run src/__tests__/edgeCategories.test.ts src/__tests__/oriso-status-config.test.ts src/components/__tests__/ContainerNodeHandles.test.ts src/components/__tests__/OrisoNodeEvidence.test.ts
      - name: Test publication, failed transfers and real Git worktrees
        run: |
          cd /tmp/oriso-ua-runtime/current/tooling
          python3 -m unittest discover -s test -p '*_test.py' -v
