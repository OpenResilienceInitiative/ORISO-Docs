name: Bilingual legal artifact contracts
on:
  pull_request:
    paths: ['oriso-platform/dsfa-text/**', 'tools/dsfa*', 'tools/legal_publication.py', 'tools/test_dsfa*', 'tools/test_legal_publication.py', '.github/workflows/legal-contracts.yml']
  push:
    branches: [dev]
    paths: ['oriso-platform/dsfa-text/**', 'tools/dsfa*', 'tools/legal_publication.py', 'tools/test_dsfa*', 'tools/test_legal_publication.py', '.github/workflows/legal-contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/dsfa-requirements.txt
      - name: Validate exact source bindings, approvals, sanitization and immutable publication
        env:
          PYTHONPATH: tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tools -p 'test_dsfa_*.py' -q
          python -m unittest discover -s tools -p 'test_legal_publication.py' -q
          python tools/dsfa_evidence.py oriso-platform/dsfa-text/evidence-map-v2.json
      # Synthetic tests install only into temporary directories. No real approval,
      # host credential, activation or legal sign-off is available in this job.
