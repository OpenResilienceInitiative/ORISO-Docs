name: Health runs

# Scheduled and on-demand health runs for the capability map (ORISO-Docs#220, epic #213).
#
# prepare pins public dev commits and selects scopes; measure runs checkout tools without model secrets;
# judge validates the independently saved plan against measurements in a fresh job, then may use the model key.
# Missing lint or coverage remains not-available; no number is invented. Only protected Docs refs run these jobs.
# The plan and measurement artifacts belong to this workflow run; checkout code is never run in the judge job.
# The cron runs from the default branch; manual runs may use dev. The records baseline is a data-only dev checkout.
# Pull requests opened with the workflow token do not start other workflows; the repository setting
# "Allow GitHub Actions to create pull requests" must be on, and the checks run when a person pushes to the branch or re-opens it.

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'One scope, <capability>/<repo> (for example chat/ORISO-Frontend). Empty: every scope that is new or changed.'
        required: false
        type: string
  pull_request:
    paths: ['tools/understand-anything/platform/**', 'tools/planning-map/**', '.github/workflows/health-runs.yml', 'health/**']

permissions:
  contents: read

# Measure runs (schedule, dispatch) share one group and run one at a time; a pull request only waits for itself.
concurrency:
  group: health-runs-${{ github.event_name == 'pull_request' && github.ref || 'measure' }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
        working-directory: tools/understand-anything
      - run: node --test tools/understand-anything/platform/test/*.test.mjs tools/planning-map/test/*.test.mjs
  prepare:
    if: github.event_name != 'pull_request' && github.repository == 'OpenResilienceInitiative/ORISO-Docs' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, pull-requests: read, issues: read}
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Stop when a health pull request is still open
        id: guard
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/health-runs-"))] | length')
          if [ "$open" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with: {ref: dev, path: .health-records, persist-credentials: false, sparse-checkout: health}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with: {node-version: '24'}
      - name: Install trusted Health tooling
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --ignore-scripts
        working-directory: tools/understand-anything
      - name: Clone public dev repositories for change detection
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          for repo in $(node tools/understand-anything/platform/health-run.mjs repos); do
            git clone --quiet --filter=blob:none --no-tags --branch dev "https://github.com/OpenResilienceInitiative/$repo" "$RUNNER_TEMP/src/$repo" || echo "::warning::Could not clone $repo"
          done
      - name: Select and pin scopes
        if: steps.guard.outputs.skip != 'true'
        env: {SCOPE: '${{ inputs.scope }}'}
        run: |
          set -euo pipefail
          args=(--checkouts "$RUNNER_TEMP/src" --root "$GITHUB_WORKSPACE/.health-records" --out "$RUNNER_TEMP/selection.json")
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          node tools/understand-anything/platform/health-run.mjs detect "${args[@]}"
          node tools/understand-anything/platform/health-batch.mjs plan --selection "$RUNNER_TEMP/selection.json" --checkouts "$RUNNER_TEMP/src" --run "$GITHUB_RUN_ID" --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out "$RUNNER_TEMP/health-plan/plan.json"
      - name: Member steering comments (optional)
        if: steps.guard.outputs.skip != 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node tools/planning-map/steering.mjs export --out "$RUNNER_TEMP/health-plan/steering.json" || echo "::warning::No steering comments available"
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with: {name: health-plan, path: '${{ runner.temp }}/health-plan/', if-no-files-found: error, retention-days: 7}
  measure:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false' && github.repository == 'OpenResilienceInitiative/ORISO-Docs' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install trusted Health tooling
        run: npm ci --ignore-scripts
        working-directory: tools/understand-anything
      - uses: actions/download-artifact@v4
        with: {name: health-plan, path: '${{ runner.temp }}/health-plan'}
      - name: Check out only pinned public dev commits
        run: node tools/understand-anything/platform/health-batch.mjs checkout --plan "$RUNNER_TEMP/health-plan/plan.json" --checkouts "$RUNNER_TEMP/src"
      - name: Measure pinned scopes in isolated containers
        run: node tools/understand-anything/platform/health-batch.mjs measure --plan "$RUNNER_TEMP/health-plan/plan.json" --checkouts "$RUNNER_TEMP/src" --root "$RUNNER_TEMP/unused-records" --out "$RUNNER_TEMP/health-measure/measurements.json"
      - uses: actions/upload-artifact@v4
        with: {name: health-measurements, path: '${{ runner.temp }}/health-measure/measurements.json', if-no-files-found: error, retention-days: 7}
  judge:
    needs: [prepare, measure]
    if: needs.prepare.outputs.skip == 'false' && github.repository == 'OpenResilienceInitiative/ORISO-Docs' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    outputs:
      records: ${{ steps.collect.outputs.count || '0' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: dev, path: .health-records, persist-credentials: false, sparse-checkout: health}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install trusted Health tooling
        run: npm ci --ignore-scripts
        working-directory: tools/understand-anything
      - uses: actions/download-artifact@v4
        with: {name: health-plan, path: '${{ runner.temp }}/health-plan'}
      - uses: actions/download-artifact@v4
        with: {name: health-measurements, path: '${{ runner.temp }}/health-measure'}
      - name: Validate measurements and judge in a fresh job
        env:
          HEALTH_MODEL_API_KEY: ${{ secrets.HEALTH_MODEL_API_KEY }}
          HEALTH_MODEL: ${{ vars.HEALTH_MODEL }}
          HEALTH_MODEL_PROVIDER: ${{ vars.HEALTH_MODEL_PROVIDER }}
          HEALTH_MODEL_BASE_URL: ${{ vars.HEALTH_MODEL_BASE_URL }}
        run: |
          set -euo pipefail
          steering=()
          if [ -s "$RUNNER_TEMP/health-plan/steering.json" ]; then steering=(--steering "$RUNNER_TEMP/health-plan/steering.json"); fi
          node tools/understand-anything/platform/health-batch.mjs judge --plan "$RUNNER_TEMP/health-plan/plan.json" --measurements "$RUNNER_TEMP/health-measure/measurements.json" --root "$GITHUB_WORKSPACE/.health-records" "${steering[@]}"
      - name: Collect and validate the new records
        id: collect
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/health-out/health/runs"
          node tools/understand-anything/platform/health-run.mjs validate --root "$GITHUB_WORKSPACE/.health-records"
          git -C "$GITHUB_WORKSPACE/.health-records" ls-files --others --exclude-standard -- health/runs | while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/health-out/$(dirname "$f")"
            cp "$GITHUB_WORKSPACE/.health-records/$f" "$RUNNER_TEMP/health-out/$f"
          done
          count=$(find "$RUNNER_TEMP/health-out/health/runs" -name '*.json' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.collect.outputs.count != '0'
        with: {name: health-runs, path: '${{ runner.temp }}/health-out/health/runs/', if-no-files-found: error, retention-days: 7}
  propose:
    needs: judge
    if: needs.judge.outputs.records != '0' && github.repository == 'OpenResilienceInitiative/ORISO-Docs' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with:
          name: health-runs
          path: ${{ runner.temp }}/health-in
      - name: Open the pull request against dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p health/runs
          cp -r "$RUNNER_TEMP/health-in/." health/runs/
          node tools/understand-anything/platform/health-run.mjs validate
          if [ -z "$(git status --porcelain health/runs/)" ]; then echo "Nothing new to propose."; exit 0; fi
          count=$(git status --porcelain --untracked-files=all health/runs/ | wc -l)
          branch="bot/health-runs-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add health/runs/
          git commit -m "chore(health): $count health run record(s) from workflow run ${GITHUB_RUN_ID}"
          git push origin "$branch"
          {
            echo "Health run records written by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): scopes that were new, or whose files changed since their last record."
            echo
            echo "Only files under \`health/runs/\` change. A record without a verdict says \`verdictStatus: skipped\` and names why (no secret, no model configured, model error)."
            echo
            echo "Refs OpenResilienceInitiative/ORISO-Docs#213"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base dev --head "$branch" --title "chore(health): $count health run record(s)" --body-file "$RUNNER_TEMP/pr-body.md"
