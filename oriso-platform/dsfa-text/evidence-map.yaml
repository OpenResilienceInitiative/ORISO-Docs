"$schema": internal/dsfa-evidence-map/v1
version: 1
generated: 2026-08-17
repo_root: /Users/frankgerhardt/ORISO

# Zweck
#   Je Aussage der DSFA-Kapitel, die auf Code oder Konfiguration fußt: wo der Beleg liegt,
#   welcher Zeilenbereich gemeint ist und welche Bezeichner dort erwartet werden.
#   Grundlage (a) für den Verfall-Detektor — verschwindet ein erwarteter Bezeichner aus dem
#   Zeilenbereich, gilt die Aussage als potenziell veraltet und die DSFA-Zeile als "stale" —
#   und (b) für die Evidenz-Dialoge der HTML-Fassung.
#
# Konventionen
#   slug      stabile Kennung, nie umbenennen (Textverweise hängen daran)
#   chapter   Abschnitt der DSFA-Kapiteltexte in diesem Verzeichnis
#   status    live | not-deployed | disabled-by-default | needs-live-verification
#             "live" heißt: im Auslieferungsstand wirksam. Alles andere darf im Trägertext
#             nicht als vorhanden beschrieben werden.
#   lines     Zeilenbereiche zum Stand der Inventare (2026-08-14); Drift ist erwartbar,
#             maßgeblich für den Detektor sind die Bezeichner unter `expect`.

